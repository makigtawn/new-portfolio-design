name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Prepare Playwright environment
        run: cp .env.test.example .env.test
      - name: End-to-end smoke tests
        run: npm run test:e2e
        env:
          ADMIN_PASSWORD: portfolio-e2e-test-password
          ADMIN_SESSION_SECRET: local-e2e-only-secret-at-least-32-characters
          GITHUB_TOKEN: test-token
          GITHUB_REPO: test-owner/test-repo
          GITHUB_BRANCH: main
          GITHUB_API_URL: http://127.0.0.1:4010
          PORT: 3020
          PLAYWRIGHT_SERVER_MODE: production
          PLAYWRIGHT_BASE_URL: http://localhost:3020
          NEXT_PUBLIC_SITE_URL: http://localhost:3020
